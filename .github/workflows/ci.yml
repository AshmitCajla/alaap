name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: alaap, POSTGRES_PASSWORD: alaap, POSTGRES_DB: alaap}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U alaap" --health-interval 5s --health-retries 10
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Schema and demo data on Postgres
        env: {DATABASE_URL: "postgresql+psycopg://alaap:alaap@localhost:5432/alaap"}
        run: python -m alaap.seed --demo-data && python -m alaap.admin businesses

  dashboard:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: dashboard}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - run: npm ci
      - run: npm run build
        env: {NEXT_PUBLIC_API_URL: "https://api.example.in"}

  docker:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.production.example .env && docker compose build
